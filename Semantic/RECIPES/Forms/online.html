<h1> ONLINE SURVEY FORM</h1>
<body style="background-color: aqua;">
    <form action="">

         <label for="fname">Full Name:</label><input type="text"
            id="fname" name="fullname" placeholder=" James Njuguna">

        <label for="email">Email:</label>
            <input type="email" 
            id="email" name="email" placeholder=" example@gmail.com">

      Gender:

        </div>
        <div>
         <input type="radio" name="gender">Female

    </div>

    Whats is your hobbies?

<div>

<input type="text" id="Browser" list="Browsers">

<datalist id="Browsers">

</datalist>

 <textarea name="feedback" id="feedback" placeholder="Give us a feedback"></textarea>
</div>

</div>

 </form>
